editions:
  - name: Cloud ERP
    line: Your records are kept in secure cloud storage.
  - name: Desktop ERP
    line: The software runs on your own computers at the mill.
faq:
  - q: Who uses BizCare ERP?
    a: More than 200 flour mills across Pakistan, from Peshawar and Swat to Quetta, Turbat and Sindh.
  - q: Can it send messages to my customers?
    a: Yes. Invoices, payment due notices, receipts and bank transfers can go to your customers on WhatsApp, and updates and reminders by SMS.
  - q: Does it handle payroll too?
    a: Yes. Employee records, attendance and salaries are part of the software.
  - q: How do I see it working?
    a: Book a demo or message us on WhatsApp, and we will show you the software.
