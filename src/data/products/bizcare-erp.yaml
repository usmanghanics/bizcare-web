  frame: window
  title: BizCare ERP
highlights:
  - Raw material and production, recorded as they happen
  - Stock and product weight you can trust
  - Accounts, profit and loss and cash flow, always up to date
fixes:
  - icon: package
    problem: Stock you cannot trust
    answer: Stock and product weight are tracked as they move, so the count on screen matches the floor.
  - icon: notebook
    problem: Accounts that take days
    answer: Ledgers, vouchers, profit and loss and cash flow stay up to date with every entry.
  - icon: whatsapp-logo
    problem: Customers chasing balances
    answer: Invoices, payment due notices, receipts and bank transfers reach your customers on WhatsApp.
features:
  - icon: factory
    title: Mill and Stock
    items:
      - Raw material and wheat purchase
      - Production output, recorded in real time
      - Stock and product weight
      - Warehouses, bags and parts
  - icon: receipt
    title: Sales and Accounts
    items:
      - Sales and purchases by date
      - Automatic invoicing and billing
      - Vouchers, ledgers and closing
